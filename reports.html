<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Business Reports | Tech BD IT Solutions</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root {
  --primary:#2457d6;
  --primary-light:#edf3ff;
  --dark:#182338;
  --muted:#7c899d;
  --border:#e6ebf2;
  --background:#f4f6fa;
  --green:#15966b;
  --orange:#d18a25;
  --red:#d34d5b;
}

*{box-sizing:border-box}

body{
  margin:0;
  padding:26px;
  background:var(--background);
  color:var(--dark);
  font-family:Inter,Arial,sans-serif;
  font-size:13px;
}

button,input,select{font-family:inherit}

.container{
  max-width:1500px;
  margin:auto;
}

/* HEADER */

.header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
  margin-bottom:25px;
}

.brand-label{
  color:var(--primary);
  font-size:10px;
  font-weight:800;
  letter-spacing:1.8px;
  margin-bottom:8px;
}

.page-title{
  font-size:27px;
  font-weight:800;
  letter-spacing:-.8px;
  margin:0 0 7px;
}

.page-subtitle{
  margin:0;
  color:var(--muted);
  font-size:12px;
}

.header-right{
  display:flex;
  gap:9px;
  align-items:center;
}

/* BUTTONS */

.btn{
  height:39px;
  padding:0 16px;
  border:1px solid var(--border);
  border-radius:7px;
  background:#fff;
  color:#4b5870;
  font-size:11px;
  font-weight:700;
  cursor:pointer;
  transition:.2s;
}

.btn:hover{
  border-color:#a9bce9;
  color:var(--primary);
}

.btn-primary{
  background:var(--primary);
  color:#fff;
  border-color:var(--primary);
  box-shadow:0 3px 8px rgba(36,87,214,.15);
}

.btn-primary:hover{
  background:#1948bd;
  color:#fff;
}

/* MAIN PANEL */

.main-panel{
  background:#fff;
  border:1px solid var(--border);
  border-radius:11px;
  box-shadow:0 4px 20px rgba(20,35,65,.04);
  overflow:hidden;
}

/* TABS */

.tabs{
  display:flex;
  align-items:center;
  gap:3px;
  padding:0 17px;
  border-bottom:1px solid var(--border);
  overflow-x:auto;
  background:#fff;
}

.tab{
  border:0;
  border-bottom:3px solid transparent;
  background:transparent;
  padding:17px 13px 15px;
  color:#78859a;
  font-size:11px;
  font-weight:700;
  white-space:nowrap;
  cursor:pointer;
}

.tab:hover{
  color:var(--primary);
  background:#f8faff;
}

.tab.active{
  color:var(--primary);
  border-bottom-color:var(--primary);
  background:#f8faff;
}

/* FILTERS */

.filter-section{
  padding:22px;
  background:#fbfcfe;
  border-bottom:1px solid var(--border);
}

.filter-heading{
  font-size:12px;
  font-weight:800;
  margin-bottom:16px;
  color:#27354b;
}

.filters{
  display:grid;
  grid-template-columns:repeat(5,minmax(130px,1fr)) auto;
  gap:13px;
  align-items:end;
}

.field{
  display:flex;
  flex-direction:column;
  gap:7px;
  min-width:0;
}

.field label{
  font-size:10px;
  font-weight:800;
  color:#68768b;
  letter-spacing:.3px;
}

.field input,
.field select{
  width:100%;
  height:40px;
  padding:0 11px;
  border:1px solid #dfe5ee;
  border-radius:7px;
  background:#fff;
  color:#344158;
  font-size:11px;
  outline:none;
}

.field input:focus,
.field select:focus{
  border-color:#7192e8;
  box-shadow:0 0 0 3px rgba(36,87,214,.08);
}

.filter-actions{
  display:flex;
  gap:8px;
}

/* SUMMARY */

.summary-area{
  padding:21px 22px 10px;
}

.section-heading{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:14px;
}

.section-heading h3{
  margin:0;
  font-size:13px;
  font-weight:800;
}

.section-heading span{
  font-size:10px;
  color:var(--muted);
}

.summary-cards{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:13px;
}

.summary-card{
  padding:18px;
  border:1px solid var(--border);
  border-radius:9px;
  background:#fff;
  transition:.2s;
}

.summary-card:hover{
  border-color:#cbd8f2;
  box-shadow:0 5px 15px rgba(20,40,80,.05);
  transform:translateY(-2px);
}

.card-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  color:#78859a;
  font-size:10px;
  font-weight:700;
}

.card-icon{
  display:grid;
  place-items:center;
  width:34px;
  height:34px;
  border-radius:8px;
  background:#edf3ff;
  color:var(--primary);
  font-size:15px;
  font-weight:800;
}

.summary-card:nth-child(2) .card-icon{
  background:#eaf7f1;
  color:var(--green);
}

.summary-card:nth-child(3) .card-icon{
  background:#fff5e7;
  color:var(--orange);
}

.summary-card:nth-child(4) .card-icon{
  background:#f1edff;
  color:#7656ce;
}

.card-value{
  margin-top:13px;
  font-size:23px;
  font-weight:800;
  letter-spacing:-.6px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  color:#1c2940;
}

.card-caption{
  margin-top:5px;
  color:#98a2b1;
  font-size:9px;
}

/* TABLE */

.table-section{
  padding:12px 22px 22px;
}

.table-box{
  border:1px solid var(--border);
  border-radius:9px;
  overflow:hidden;
}

.table-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  padding:17px 18px;
  border-bottom:1px solid var(--border);
}

.table-title{
  font-size:13px;
  font-weight:800;
  margin:0;
}

.table-description{
  font-size:10px;
  color:var(--muted);
  margin:5px 0 0;
}

.table-tools{
  display:flex;
  align-items:center;
  gap:8px;
}

.search-input{
  width:220px;
  height:36px;
  border:1px solid #dfe5ee;
  border-radius:7px;
  padding:0 11px;
  outline:none;
  font-size:11px;
}

.search-input:focus{
  border-color:#7192e8;
}

.table-wrap{
  overflow-x:auto;
}

table{
  width:100%;
  min-width:750px;
  border-collapse:collapse;
}

thead th{
  background:#f6f8fb;
  color:#68768b;
  text-align:left;
  padding:14px 15px;
  font-size:9px;
  font-weight:800;
  letter-spacing:.5px;
  text-transform:uppercase;
  white-space:nowrap;
}

tbody td{
  padding:14px 15px;
  border-top:1px solid #edf0f5;
  color:#46546a;
  font-size:11px;
  white-space:nowrap;
}

tbody tr:hover{
  background:#f8faff;
}

.ref{
  color:var(--primary);
  font-weight:800;
}

.amount{
  color:#1c2940;
  font-weight:800;
}

.status{
  display:inline-block;
  padding:5px 9px;
  border-radius:5px;
  background:#edf2ff;
  color:#4169cb;
  font-size:9px;
  font-weight:800;
}

.status.paid,
.status.received,
.status.processed,
.status.approved,
.status.converted,
.status.in-stock{
  background:#eaf7f1;
  color:#16845f;
}

.status.due,
.status.pending,
.status.partial,
.status.draft,
.status.low-stock{
  background:#fff5e7;
  color:#b7791f;
}

.status.cancelled,
.status.rejected,
.status.returned,
.status.expired,
.status.out-of-stock{
  background:#fff0f1;
  color:#c74756;
}

.empty{
  text-align:center;
  padding:45px 15px;
  color:#8996a8;
}

.empty strong{
  display:block;
  margin-bottom:7px;
  color:#526178;
  font-size:12px;
}

.empty span{
  font-size:10px;
}

.table-footer{
  display:flex;
  justify-content:space-between;
  gap:10px;
  padding:13px 17px;
  background:#fafbfd;
  border-top:1px solid var(--border);
  color:#69778d;
  font-size:10px;
  font-weight:700;
}

/* RESPONSIVE */

@media(max-width:1100px){
  .filters{
    grid-template-columns:repeat(3,minmax(120px,1fr));
  }
}

@media(max-width:750px){
  body{padding:12px}

  .header{
    align-items:flex-start;
    flex-direction:column;
  }

  .filters{
    grid-template-columns:repeat(2,minmax(0,1fr));
  }

  .summary-cards{
    grid-template-columns:repeat(2,minmax(0,1fr));
  }

  .table-header{
    align-items:flex-start;
    flex-direction:column;
  }

  .table-tools{
    width:100%;
  }

  .search-input{
    flex:1;
    width:100%;
  }
}

@media(max-width:430px){
  .summary-cards{
    gap:8px;
  }

  .summary-card{
    padding:13px;
  }

  .card-value{
    font-size:18px;
  }

  .filters{
    grid-template-columns:1fr;
  }

  .filter-actions .btn{
    flex:1;
  }
}

/* PRINT */

@media print{
  body{background:#fff;padding:0}
  .header-right,.tabs,.filter-section,.table-tools{display:none!important}
  .main-panel{border:0;box-shadow:none}
  .summary-card,.table-box{break-inside:avoid}
}
</style>
</head>

<body>

<div class="container">

  <header class="header">
    <div>
      <div class="brand-label">TECH BD IT SOLUTIONS</div>
      <h1 class="page-title">Business Reports</h1>
      <p class="page-subtitle">Manage and analyse your business transactions</p>
    </div>

    <div class="header-right">
      <button class="btn" onclick="resetFilters()">↺ Reset Filters</button>
    </div>
  </header>

  <main class="main-panel">

    <!-- REPORT TABS -->

    <div class="tabs" id="tabs">
      <button class="tab active" data-type="sales">Sales Report</button>
      <button class="tab" data-type="quotations">Quotation Report</button>
      <button class="tab" data-type="purchases">Purchase Report</button>
      <button class="tab" data-type="salesReturns">Sales Return</button>
      <button class="tab" data-type="purchaseReturns">Purchase Return</button>
      <button class="tab" data-type="expenses">Expense Report</button>
      <button class="tab" data-type="collections">Collection Report</button>
      <button class="tab" data-type="stock">Stock Report</button>
      <button class="tab" data-type="profit">Profit & Loss</button>
    </div>

    <!-- FILTER SECTION -->

    <section class="filter-section">

      <div class="filter-heading">Report Filters</div>

      <div class="filters">

        <div class="field">
          <label>FROM DATE</label>
          <input type="date" id="fromDate">
        </div>

        <div class="field">
          <label>TO DATE</label>
          <input type="date" id="toDate">
        </div>

        <div class="field">
          <label>COUNTER</label>
          <select id="counter">
            <option value="">All Counters</option>
          </select>
        </div>

        <div class="field">
          <label>STAFF / USER</label>
          <select id="user">
            <option value="">All Users</option>
          </select>
        </div>

        <div class="field">
          <label>STATUS</label>
          <select id="status">
            <option value="">All Statuses</option>
          </select>
        </div>

        <div class="filter-actions">
          <button class="btn btn-primary" onclick="viewFilteredReport()">
            View Report →
          </button>
        </div>

      </div>
    </section>

    <!-- SUMMARY -->

    <section class="summary-area">

      <div class="section-heading">
        <h3>Report Overview</h3>
        <span id="summaryPeriod">All Records</span>
      </div>

      <div class="summary-cards" id="summary"></div>

    </section>

    <!-- DATA TABLE -->

    <section class="table-section">

      <div class="table-box">

        <div class="table-header">
          <div>
            <h3 class="table-title" id="tableTitle">Sales Transactions</h3>
            <p class="table-description" id="tableSubtitle">
              Invoice-wise sales details
            </p>
          </div>

          <div class="table-tools">
            <input
              class="search-input"
              id="search"
              type="search"
              placeholder="Search records..."
              oninput="renderTable()"
            >
          </div>
        </div>

        <div class="table-wrap" id="reportTable"></div>

        <div class="table-footer">
          <span id="rowCount">0 records</span>
          <span id="totalLabel">Total: ৳0.00</span>
        </div>

      </div>

    </section>

  </main>

</div>

<script>

/* ======================================
   REPORT CONFIGURATION
====================================== */

const cfg = {

 sales:{
  title:"Sales Transactions",
  sub:"Invoice-wise sales details",
  ref:"Invoice No.",
  party:"Customer",
  date:"Date",
  amount:"Net Sales",
  statuses:["Paid","Due","Partial","Cancelled"],
  metrics:["Total Invoices","Net Sales","Paid Amount","Due Amount"]
 },

 quotations:{
  title:"Quotation Register",
  sub:"Quotation value and conversion status",
  ref:"Quotation No.",
  party:"Customer",
  date:"Date",
  amount:"Quotation Total",
  statuses:["Draft","Sent","Approved","Rejected","Converted","Expired"],
  metrics:["Total Quotations","Quotation Value","Approved","Converted"]
 },

 purchases:{
  title:"Purchase Register",
  sub:"Supplier bills and payments",
  ref:"Purchase No.",
  party:"Supplier",
  date:"Date",
  amount:"Net Purchase",
  statuses:["Paid","Due","Partial","Cancelled"],
  metrics:["Purchase Bills","Purchase Value","Paid Amount","Due Amount"]
 },

 salesReturns:{
  title:"Sales Return Register",
  sub:"Returned invoices and refund values",
  ref:"Return No.",
  party:"Customer",
  date:"Date",
  amount:"Return Amount",
  statuses:["Processed","Pending","Rejected"],
  metrics:["Return Entries","Return Value","Processed","Pending"]
 },

 purchaseReturns:{
  title:"Purchase Return Register",
  sub:"Goods returned to suppliers",
  ref:"Return No.",
  party:"Supplier",
  date:"Date",
  amount:"Return Amount",
  statuses:["Processed","Pending","Rejected"],
  metrics:["Return Entries","Return Value","Processed","Pending"]
 },

 expenses:{
  title:"Expense Register",
  sub:"Business expenses by category",
  ref:"Expense ID",
  party:"Category",
  date:"Date",
  amount:"Expense Amount",
  statuses:["Paid","Unpaid","Cancelled"],
  metrics:["Expense Entries","Total Expenses","Paid","Unpaid"]
 },

 collections:{
  title:"Customer Collections",
  sub:"Payments received from customers",
  ref:"Receipt No.",
  party:"Customer",
  date:"Date",
  amount:"Received Amount",
  statuses:["Received","Pending","Reversed"],
  metrics:["Receipts","Collected Amount","Received","Pending"]
 },

 stock:{
  title:"Stock Overview",
  sub:"Current inventory quantity and value",
  ref:"Product Code",
  party:"Product",
  date:"Updated",
  amount:"Stock Value",
  statuses:["In Stock","Low Stock","Out of Stock"],
  metrics:["Products","Stock Units","Stock Value","Low / Out"]
 },

 profit:{
  title:"Profit & Loss",
  sub:"Sales, cost and expense summary",
  ref:"Reference",
  party:"Description",
  date:"Date",
  amount:"Amount",
  statuses:["Posted","Pending"],
  metrics:["Net Sales","Cost of Goods","Expenses","Gross Profit"]
 }

};

/* ======================================
   DATA STORAGE
====================================== */

let data = {
 sales:[],
 quotations:[],
 purchases:[],
 salesReturns:[],
 purchaseReturns:[],
 expenses:[],
 collections:[],
 stock:[],
 profit:[]
};

let active = "sales";
let filtered = [];

/* ======================================
   HELPERS
====================================== */

const money = n =>
 "৳" + Number(n || 0).toLocaleString("en-BD",{
  minimumFractionDigits:2,
  maximumFractionDigits:2
 });

const esc = s =>
 String(s ?? "—").replace(/[&<>"']/g,c=>({
  "&":"&amp;",
  "<":"&lt;",
  ">":"&gt;",
  '"':"&quot;",
  "'":"&#39;"
 }[c]));

function statusClass(s){
 return String(s || "")
  .toLowerCase()
  .replace(/\s+/g,"-");
}

function formatIsoDate(raw){
 if(!raw) return "";
 if(typeof raw === "number"){
  return new Date(raw).toISOString().slice(0,10);
 }
 const s = String(raw).trim();
 const dmy = s.match(/^(\d{2})\/(\d{2})\/(\d{4})/);
 if(dmy){
  return `${dmy[3]}-${dmy[2]}-${dmy[1]}`;
 }
 return s.slice(0,10);
}

/* ======================================
   NORMALIZE POS & FIRESTORE DATA
====================================== */

function normalize(r){

 let resolvedStatus = r.status;
 if(!resolvedStatus){
  const pay = String(r.paymentSelectValue ?? r.paymentMethod ?? "").trim().toUpperCase();
  if(pay === "DUE") resolvedStatus = "Due";
  else if(pay) resolvedStatus = "Paid";
  else resolvedStatus = "—";
 }

 const rawDate = r.date ?? r.createdAt ?? r.invoiceDate ?? r.createdAtMs ?? "";

 return {

  ref:
   r.ref ??
   r.invoiceNumber ??
   r.invoiceNo ??
   r.invoice ??
   r.quotationNo ??
   r.purchaseNo ??
   r.barcode ??
   r.productId ??
   r.id ??
   "",

  date: formatIsoDate(rawDate),

  party:
   r.party ??
   r.customerName ??
   r.customer ??
   r.supplier ??
   r.category ??
   r.name ??
   r.productName ??
   "",

  amount:Number(
   r.amount ??
   r.subTotal ??
   r.totalAmount ??
   r.total ??
   r.grandTotal ??
   r.netTotal ??
   (Number(r.price || 0) * Number(r.stock ?? r.quantity ?? r.qty ?? 0)) ??
   0
  ),

  status: resolvedStatus,

  counter:
   r.counter ??
   r.counterName ??
   r.store ??
   "",

  user:
   r.user ??
   r.cashier ??
   r.createdBy ??
   "",

  quantity:Number(r.quantity ?? r.qty ?? r.stock ?? r.totalQty ?? 0),

  due:Number(r.due ?? r.dueAmount ?? 0),

  cost:Number(r.cost ?? 0),

  expense:Number(r.expense ?? 0)

 };

}

/* ======================================
   TAB SWITCHING
====================================== */

document.getElementById("tabs").addEventListener("click",e=>{

 const b = e.target.closest("[data-type]");

 if(!b)return;

 active = b.dataset.type;

 document.querySelectorAll(".tab").forEach(x=>{
  x.classList.toggle("active",x===b);
 });

 document.getElementById("search").value="";

 fillFilters();
 render();

});

/* ======================================
   FILTER DROPDOWNS
====================================== */

function fillFilters(){

 const rows = data[active];

 for(const [id,key,label] of [
  ["counter","counter","All Counters"],
  ["user","user","All Users"]
 ]){

  const el = document.getElementById(id);
  const old = el.value;

  const vals = [
   ...new Set(rows.map(r=>r[key]).filter(Boolean))
  ];

  el.innerHTML =
   `<option value="">${label}</option>` +
   vals.map(v=>
    `<option value="${esc(v)}">${esc(v)}</option>`
   ).join("");

  if(vals.includes(old))el.value=old;

 }

 const el = document.getElementById("status");
 const old = el.value;

 el.innerHTML =
  '<option value="">All Statuses</option>' +
  cfg[active].statuses.map(s=>
   `<option value="${esc(s)}">${esc(s)}</option>`
  ).join("");

 if(cfg[active].statuses.includes(old)){
  el.value=old;
 }

}

/* ======================================
   GET FILTERED DATA
====================================== */

function getRows(){

 const from = document.getElementById("fromDate").value;
 const to = document.getElementById("toDate").value;
 const counter = document.getElementById("counter").value;
 const user = document.getElementById("user").value;
 const status = document.getElementById("status").value;

 return data[active].filter(r=>

  (!from || r.date >= from) &&
  (!to || r.date <= to) &&
  (!counter || r.counter === counter) &&
  (!user || r.user === user) &&
  (!status || r.status === status)

 );

}

/* ======================================
   RENDER REPORT
====================================== */

function render(){

 filtered = getRows();

 const c = cfg[active];

 document.getElementById("tableTitle").textContent = c.title;
 document.getElementById("tableSubtitle").textContent = c.sub;

 const from = document.getElementById("fromDate").value;
 const to = document.getElementById("toDate").value;

 document.getElementById("summaryPeriod").textContent =
  from || to ? `${from || "Start"} to ${to || "Today"}` : "All Records";

 renderSummary();
 renderTable();

}

/* ======================================
   SUMMARY CARDS
====================================== */

function renderSummary(){

 const rows = filtered;

 const sum = rows.reduce((a,r)=>a+r.amount,0);

 const paid = rows
  .filter(r=>[
   "Paid","Received","Processed","Approved","Converted"
  ].includes(r.status))
  .reduce((a,r)=>a+r.amount,0);

 const due = rows
  .filter(r=>[
   "Due","Unpaid","Pending","Partial"
  ].includes(r.status))
  .reduce((a,r)=>a+(r.due || r.amount),0);

 const cost = rows.reduce((a,r)=>a+r.cost,0);

 const expense = rows.reduce((a,r)=>a+r.expense,0);

 let vals;

 if(active==="stock"){

  vals=[
   rows.length,
   rows.reduce((a,r)=>a+r.quantity,0),
   money(sum),
   rows.filter(r=>[
    "Low Stock","Out of Stock"
   ].includes(r.status)).length
  ];

 }else if(active==="profit"){

  vals=[
   money(sum),
   money(cost),
   money(expense),
   money(sum-cost-expense)
  ];

 }else{

  vals=[
   rows.length,
   money(sum),
   money(paid),
   money(due)
  ];

 }

 const icons=["▤","৳","✓","◷"];

 document.getElementById("summary").innerHTML =
  cfg[active].metrics.map((m,i)=>`

   <div class="summary-card">

    <div class="card-top">
     <span>${esc(m)}</span>
     <span class="card-icon">${icons[i]}</span>
    </div>

    <div class="card-value">${vals[i] ?? 0}</div>

    <div class="card-caption">
     Based on selected report filters
    </div>

   </div>

  `).join("");

}

/* ======================================
   TABLE RENDERING
====================================== */

function getColumns(){

 const c = cfg[active];

 let cols=[
  ["ref",c.ref],
  ["date",c.date],
  ["party",c.party],
  ["amount",c.amount],
  ["status","Status"],
  ["counter","Counter"],
  ["user","User"]
 ];

 if(active==="stock"){
  cols=cols.filter(([k])=>
   !["counter","user"].includes(k)
  );
 }

 return cols;

}

function renderTable(){

 const c = cfg[active];

 const q = document.getElementById("search").value.toLowerCase();

 const rows = filtered.filter(r=>
  JSON.stringify(r).toLowerCase().includes(q)
 );

 const cols = getColumns();

 let html = `
  <table>
   <thead>
    <tr>
     ${cols.map(x=>`<th>${esc(x[1])}</th>`).join("")}
    </tr>
   </thead>
   <tbody>
 `;

 if(!rows.length){

  html += `
   <tr>
    <td colspan="${cols.length}">
     <div class="empty">
      <strong>No Records Found</strong>
      <span>No data is available for the selected report or filters.</span>
     </div>
    </td>
   </tr>
  `;

 }else{

  rows.forEach(r=>{

   html += "<tr>";

   cols.forEach(([k])=>{

    if(k==="ref"){

     html += `<td class="ref">${esc(r[k])}</td>`;

    }else if(k==="amount"){

     html += `<td class="amount">${money(r[k])}</td>`;

    }else if(k==="status"){

     html += `
      <td>
       <span class="status ${statusClass(r[k])}">
        ${esc(r[k])}
       </span>
      </td>
     `;

    }else{

     html += `<td>${esc(r[k])}</td>`;

    }

   });

   html += "</tr>";

  });

 }

 html += "</tbody></table>";

 document.getElementById("reportTable").innerHTML = html;

 document.getElementById("rowCount").textContent =
  rows.length + " records";

 document.getElementById("totalLabel").textContent =
  "Total: " + money(
   rows.reduce((a,r)=>a+r.amount,0)
  );

}

/* ======================================
   RESET FILTERS
====================================== */

function resetFilters(){

 [
  "fromDate",
  "toDate",
  "counter",
  "user",
  "status",
  "search"
 ].forEach(id=>{
  document.getElementById(id).value="";
 });

 fillFilters();
 render();

}

/* ======================================
   CLOUD POS DATA CONNECTION
   KEEP THIS API AVAILABLE
====================================== */

window.CloudPOSReports = {

 setData(input){

  Object.keys(data).forEach(k=>{

   if(Array.isArray(input[k])){
    data[k]=input[k].map(normalize);
   }

  });

  fillFilters();
  render();

 },

 addRecord(type,record){

  if(!data[type]){
   throw Error("Unknown report type: "+type);
  }

  data[type].push(normalize(record));

  if(type===active){
   fillFilters();
   render();
  }

 },

 refresh(){

  fillFilters();
  render();

 },

 clear(type){

  if(type && data[type]){
   data[type]=[];
  }else{
   Object.keys(data).forEach(k=>data[k]=[]);
  }

  fillFilters();
  render();

 }

};

/* INITIALIZE */

fillFilters();
render();

</script>

<script type="module">
import { db } from './assets/firebase-config.js';
import {
 collection,
 getDocs
} from "https://www.gstatic.com/firebasejs/13.4.0/firebase-firestore.js";

async function fetchCollectionSafe(colName){
 try{
  const snap = await getDocs(collection(db, colName));
  const list = [];
  snap.forEach(docSnap => {
   list.push({ id: docSnap.id, ...docSnap.data() });
  });
  return list;
 }catch(err){
  console.warn(`Firestore collection "${colName}" load issue:`, err);
  return [];
 }
}

async function loadReportsFromFirestore(){
 const [
  invoices,
  products,
  quotations,
  purchases,
  salesReturns,
  purchaseReturns,
  expenses,
  collectionsList,
  profitList
 ] = await Promise.all([
  fetchCollectionSafe("invoices"),
  fetchCollectionSafe("products"),
  fetchCollectionSafe("quotations"),
  fetchCollectionSafe("purchases"),
  fetchCollectionSafe("salesReturns"),
  fetchCollectionSafe("purchaseReturns"),
  fetchCollectionSafe("expenses"),
  fetchCollectionSafe("collections"),
  fetchCollectionSafe("profit")
 ]);

 const stockRows = products.map(p => {
  const qty = Number(p.stock ?? p.quantity ?? p.qty ?? 0);
  const price = Number(p.price ?? p.salePrice ?? p.rate ?? 0);
  let st = p.status;
  if(!st){
   if(qty <= 0) st = "Out of Stock";
   else if(qty <= 5) st = "Low Stock";
   else st = "In Stock";
  }
  return {
   ...p,
   ref: p.barcode || p.productId || p.code || p.id,
   party: p.name || p.productName || p.title || "Item",
   quantity: qty,
   amount: p.amount ?? (qty * price),
   status: st
  };
 });

 window.CloudPOSReports.setData({
  sales: invoices,
  stock: stockRows,
  quotations,
  purchases,
  salesReturns,
  purchaseReturns,
  expenses,
  collections: collectionsList.length ? collectionsList : invoices,
  profit: profitList.length ? profitList : invoices
 });
}

window.addEventListener("DOMContentLoaded", loadReportsFromFirestore);
</script>
