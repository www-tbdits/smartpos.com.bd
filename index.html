<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart POS1 | Login</title>

    <script>
        (function checkAlreadyLoggedIn() {
            const isLogged = sessionStorage.getItem('tbdits_logged_in');
            const loggedInUser = JSON.parse(sessionStorage.getItem('tbdits_user') || 'null');
            if (isLogged && loggedInUser) {
                window.location.replace('Dashboard.html');
            }
        })();
    </script>

    <link rel="icon" type="image/svg+xml"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><path fill='%23275efe' d='M416 208c0-45.9-34.5-83.8-79.1-89.2C318.4 79.5 275.6 48 224 48c-61.9 0-112 50.1-112 112 0 7.8 .8 15.4 2.4 22.8C51.5 195.4 16 242.3 16 296c0 61.9 50.1 112 112 112h288c53 0 96-43 96-96 0-43.1-28.1-79.5-67-91.8z'/><path fill='%23ffffff' d='M256 192l-80 80h48v96h64v-96h48l-80-80z'/></svg>">
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Cinzel:wght@700;900&family=Outfit:wght@700;800;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: #e4ebf5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        .login-circle {
            width: 440px;
            height: 440px;
            background-color: #e4ebf5;
            border-radius: 50%;
            box-shadow: 20px 20px 40px #cbced1, -20px -20px 40px #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            padding: 40px;
            transition: all 0.6s cubic-bezier(0.68, -0.55, 0.27, 1.55);
        }

        .login-circle.exit-animation {
            transform: scale(0) rotate(360deg);
            opacity: 0;
        }

        .form-content {
            width: 100%;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .brand-header {
            margin-bottom: 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .brand-title {
            font-family: 'Cinzel', serif;
            font-size: 32px;
            font-weight: 900;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: #1e3a8a;
            text-shadow: 2px 2px 4px #cbced1, -2px -2px 4px #ffffff;
        }

        .input-group {
            margin-bottom: 18px;
            width: 100%;
            display: flex;
            justify-content: center;
            position: relative;
        }

        .input-group input {
            width: 90%;
            padding: 14px 22px;
            border: none;
            outline: none;
            background: #e4ebf5;
            font-size: 14px;
            color: #1e293b;
            font-weight: 600;
            border-radius: 30px;
            box-shadow: inset 6px 6px 12px #cbced1, inset -6px -6px 12px #ffffff;
            transition: all 0.3s ease;
        }

        .input-group input::placeholder {
            color: #94a3b8;
            font-weight: 500;
        }

        .input-group input:focus {
            box-shadow: inset 3px 3px 6px #cbced1, inset -3px -3px 6px #ffffff, 0 0 12px rgba(39, 94, 254, 0.2);
        }

        .toggle-password {
            position: absolute;
            right: 42px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #94a3b8;
            font-size: 15px;
            transition: color 0.3s;
        }

        .toggle-password:hover {
            color: #275efe;
        }

        .error-msg {
            color: #ef4444;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 8px;
            display: none;
            animation: shake 0.3s ease-in-out;
        }

        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-5px);
            }

            75% {
                transform: translateX(5px);
            }
        }

        .btn-submit {
            width: 87%;
            padding: 13px;
            border: none;
            outline: none;
            background: linear-gradient(145deg, #f1f5f9, #dbeafe);
            color: #2563eb;
            font-size: 15px;
            font-weight: 800;
            letter-spacing: 1px;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 6px 6px 14px #cbced1, -6px -6px 14px #ffffff;
            transition: all 0.2s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .btn-submit:hover {
            color: #1d4ed8;
            box-shadow: 4px 4px 10px #cbced1, -4px -4px 10px #ffffff;
        }

        .btn-submit:active {
            box-shadow: inset 4px 4px 8px #cbced1, inset -4px -4px 8px #ffffff;
        }

        .btn-submit:disabled {
            opacity: 0.8;
            cursor: not-allowed;
        }

        .site-footer {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #e4ebf5;
            padding: 14px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0px -5px 20px rgba(203, 205, 209, 0.6);
            font-size: 12px;
            color: #627490;
            font-weight: 500;
            border-top: 1px solid rgba(255, 255, 255, 0.6);
        }

        .footer-left {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            color: #1e3a8a;
        }

        .footer-left i {
            color: #275efe;
            font-size: 14px;
        }

        .footer-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .footer-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .footer-item i {
            color: #275efe;
        }

        .footer-item strong {
            color: #334155;
        }

        .footer-link {
            color: #334155;
            text-decoration: none;
            font-weight: 700;
            transition: color 0.3s;
        }

        .footer-link:hover {
            color: #2563eb;
            text-decoration: none;
        }

        @media (max-width: 768px) {
            .login-circle {
                width: 370px;
                height: 370px;
                padding: 25px;
            }

            .site-footer {
                flex-direction: column;
                gap: 8px;
                text-align: center;
                padding: 12px 15px;
            }

            .footer-right {
                flex-direction: column;
                gap: 5px;
            }
        }
    </style>
</head>

<body oncontextmenu="return false;">
    <div class="login-circle" id="loginContainer">
        <form class="form-content" id="formContent" onsubmit="handleLogin(event)">
            <div class="brand-header">
                <span class="brand-title">SIGN IN</span>
            </div>
            <div class="input-group">
                <input type="text" id="username" placeholder="Username" required autocomplete="username">
            </div>
            <div class="input-group">
                <input type="password" id="password" placeholder="Password" required autocomplete="current-password">
                <i class="fa-solid fa-eye toggle-password" id="togglePassword" onclick="togglePasswordVisibility()"></i>
            </div>
            <div class="error-msg" id="errorMsg">Invalid username or password!</div>
            <button type="submit" class="btn-submit" id="submitBtn">
                <span>Login</span>
            </button>
        </form>
    </div>

    <footer class="site-footer">
        <div class="footer-left">
            <i class="fa-solid fa-cloud-arrow-up"></i>
            <span>Smart POS</span>
        </div>
        <div class="footer-right">
            <div class="footer-item">
                <i class="fa-solid fa-headset"></i>
                <span>Need Help? Call: <strong>+880 9638665205</strong></span>
            </div>
            <div class="footer-item">
                <i class="fa-solid fa-code-branch"></i>
                <span>System by: <strong>Tech bd it solutions</strong></span>
            </div>
            <div class="footer-item">
                <i class="fa-solid fa-globe"></i>
                <!-- Fixed Text Label Here -->
                <span>Website: <a href="https://www-tbdits.github.io/techbditsolutions.com/" target="_blank"
                        class="footer-link">www.techbditsolutions.com</a></span>
            </div>
        </div>
    </footer>

    <script>
        document.addEventListener('keydown', function (event) {
            if (event.keyCode === 123 || (event.ctrlKey && event.shiftKey && (event.keyCode === 73 || event.keyCode === 74)) || (event.ctrlKey && event.keyCode === 85)) {
                event.preventDefault();
                return false;
            }
        });

        function togglePasswordVisibility() {
            const p = document.getElementById('password');
            const i = document.getElementById('togglePassword');
            if (p.type === 'password') {
                p.type = 'text';
                i.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                p.type = 'password';
                i.classList.replace('fa-eye-slash', 'fa-eye');
            }
        }

        function handleLogin(event) {
            event.preventDefault();
            const u = document.getElementById('username').value.trim();
            const p = document.getElementById('password').value.trim();
            const c = document.getElementById('loginContainer');
            const e = document.getElementById('errorMsg');
            const b = document.getElementById('submitBtn');

            const customUsers = JSON.parse(localStorage.getItem('tbdits_users')) || [];
            const defUsers = [{ username: 'jems', password: '6735', role: 'admin', permissions: ['Sales Reports', 'Sales of Point', 'Customers', 'Products', 'User Control', 'Inventory', 'Help', 'Logout'] }];
            const allUsers = [...defUsers, ...customUsers];

            const found = allUsers.find(x => x.username === u && x.password === p);

            if (found) {
                e.style.display = 'none';
                b.disabled = true;
                b.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Logging in...`;

                sessionStorage.setItem('tbdits_logged_in', 'true');
                sessionStorage.setItem('tbdits_user', JSON.stringify(found));
                c.classList.add('exit-animation');

                setTimeout(() => {
                    window.location.href = 'Dashboard.html';
                }, 450);
            } else {
                e.style.display = 'block';
                const pf = document.getElementById('password');
                pf.value = '';
                pf.focus();
            }
        }
    </script>
</body>

</html>
