<!DOCTYPE html>
<html lang="bn">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartPOS</title>

  <!-- তাত্ক্ষণিক সিকিউরিটি চেক (Ctrl+Shift+T বা ক্যাশ রিলোড রোধ করতে) -->
  <script>
    (function () {
      const isLogged = sessionStorage.getItem('tbdits_logged_in');
      const loggedInUser = sessionStorage.getItem('tbdits_user');
      if (!isLogged || !loggedInUser) {
        window.location.replace('index.html');
      }
    })();

    // ব্রাউজারের ক্যাশ থেকে পেজ রিস্টোর হলে সাথে সাথে চেক করা
    window.addEventListener('pageshow', function (event) {
      if (event.persisted || (window.performance && window.performance.navigation.type === 2)) {
        if (!sessionStorage.getItem('tbdits_logged_in') || !sessionStorage.getItem('tbdits_user')) {
          window.location.replace('index.html');
        }
      }
    });
  </script>

  <link rel="icon" type="image/svg+xml"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><path fill='%23275efe' d='M416 208c0-45.9-34.5-83.8-79.1-89.2C318.4 79.5 275.6 48 224 48c-61.9 0-112 50.1-112 112 0 7.8 .8 15.4 2.4 22.8C51.5 195.4 16 242.3 16 296c0 61.9 50.1 112 112 112h288c53 0 96-43 96-96 0-43.1-28.1-79.5-67-91.8z'/><path fill='%23ffffff' d='M256 192l-80 80h48v96h64v-96h48l-80-80z'/></svg>">
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Cinzel:wght@700;900&family=Orbitron:wght@700;900&display=swap"
    rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">

  <!-- স্টাইল ফাইল -->
  <link rel="stylesheet" href="dashboard.css">
</head>

<body>

  <header>
    <div class="company-info" style="display:flex; align-items:center; width:100%; justify-content:space-between;">
      <div style="display:flex; align-items:center;">
        <img src="images/PosLogo.png" alt="Logo" onerror="this.style.display='none'" />
        <div class="company-name">TECH BD IT SOLUTIONS</div>
      </div>

      <div class="user-profile-container" id="userProfileContainer">
        <div class="user-profile-btn" id="userProfileBtn">
          <i class='bx bxs-user user-icon'></i>
          <div style="display:flex; align-items:center; gap:4px; font-weight:600; color:#334155; font-size:14px;">
            <span id="userDisplay" style="color:#2563eb; font-weight:700;"></span>
          </div>
          <i class='bx bx-chevron-down' style="font-size: 16px; color: #627490;"></i>
        </div>

        <div class="user-dropdown-menu" id="userDropdownMenu">
          <div class="user-dropdown-item" id="changePasswordBtn">
            <i class='bx bxs-key'></i>
            <span>Password Change</span>
          </div>
          <div class="user-dropdown-item logout-btn" id="dropdownLogoutBtn">
            <i class='bx bxs-log-out-circle'></i>
            <span>Logout</span>
          </div>
        </div>
      </div>

    </div>
  </header>

  <main>
    <div class="icon-grid" id="iconGrid"></div>

    <div class="image-box">
      <div class="pos-stylish-brand">Smart POS</div>

      <div class="ecosystem-container">
        <svg class="ecosystem-svg-lines" viewBox="0 0 620 420">
          <line x1="310" y1="84" x2="310" y2="175" class="eco-line" stroke-width="2.5" />
          <line x1="310" y1="216" x2="40" y2="120" class="eco-line" />
          <line x1="310" y1="216" x2="580" y2="120" class="eco-line" />
          <line x1="310" y1="216" x2="25" y2="205" class="eco-line" />
          <line x1="310" y1="216" x2="595" y2="205" class="eco-line" />
          <line x1="310" y1="216" x2="40" y2="295" class="eco-line" />
          <line x1="310" y1="216" x2="580" y2="295" class="eco-line" />
          <line x1="310" y1="216" x2="125" y2="375" class="eco-line" />
          <line x1="310" y1="216" x2="495" y2="375" class="eco-line" />
          <line x1="310" y1="216" x2="250" y2="385" class="eco-line" />
          <line x1="310" y1="216" x2="370" y2="385" class="eco-line" />
        </svg>

        <div class="pos-cloud-hub" title="Cloud Hub">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
            <path fill="#275efe"
              d="M416 208c0-45.9-34.5-83.8-79.1-89.2C318.4 79.5 275.6 48 224 48c-61.9 0-112 50.1-112 112 0 7.8 .8 15.4 2.4 22.8C51.5 195.4 16 242.3 16 296c0 61.9 50.1 112 112 112h288c53 0 96-43 96-96 0-43.1-28.1-79.5-67-91.8z" />
            <path fill="#ffffff" d="M256 192l-80 80h48v96h64v-96h48l-80-80z" />
          </svg>
        </div>

        <div class="pos-server-hub" title="Core Server">
          <i class='bx bx-server'></i>
        </div>

        <div class="eco-node node-database" title="Database SQL"><i class='bx bx-data'></i></div>
        <div class="eco-node node-security" title="Security & Shield"><i class='bx bx-shield-quarter'></i></div>
        <div class="eco-node node-customer" title="Customer Management"><i class='bx bxs-user-detail'></i></div>
        <div class="eco-node node-userctrl" title="User Control"><i class='bx bxs-user-check'></i></div>
        <div class="eco-node node-pos-term" title="POS Terminal"><i class='bx bx-desktop'></i></div>
        <div class="eco-node node-mobile" title="Mobile App Ecosystem"><i class='bx bx-mobile-alt'></i></div>
        <div class="eco-node node-api" title="API Gateway"><i class='bx bx-transfer-alt'></i></div>
        <div class="eco-node node-analytics" title="Business Analytics"><i class='bx bx-pie-chart-alt-2'></i></div>
        <div class="eco-node node-printer" title="Receipt Printer"><i class='bx bx-printer'></i></div>
        <div class="eco-node node-help" title="Help & Support"><i class='bx bx-help-circle'></i></div>
      </div>
    </div>
  </main>

  <div id="popupManager"></div>
  <div id="minimizedDock"
    style="position: fixed; bottom: 15px; right: 15px; display: flex; flex-direction: column-reverse; gap: 8px; z-index: 10000; align-items: flex-end; pointer-events: none;">
  </div>

  <footer class="site-footer">
    <div class="footer-left">
      <i class="fa-solid fa-cloud-arrow-up"></i>
      <span>Smart POS- v 1.0.10</span>
    </div>
    <div class="footer-right">
      <div class="footer-item">
        <i class="fa-solid fa-headset"></i>
        <span>Need Help? Call: <strong>+880 9638665205</strong></span>
      </div>
      <div class="footer-item">
        <i class="fa-solid fa-code-branch"></i>
        <span>System by: <strong>Tech bd it solutions</strong></span>
      </div>
      <div class="footer-item">
        <i class="fa-solid fa-globe"></i>
        <span>Website: <a href="https://www-tbdits.github.io/techbditsolutions.com/" target="_blank"
            class="footer-link">www.techbditsolutions.com</a></span>
      </div>
    </div>
  </footer>

  <!-- জাভাস্ক্রিপ্ট ফাইল -->
  <script src="dashboard.js"></script>
</body>

</html>
